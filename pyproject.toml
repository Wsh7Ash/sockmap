[build-system]
requires=["setuptools>=61.0"]
build-backend="setuptools.build_meta"
[project]
name="sockmap"
version="0.1.0"
description="Localhost port to service mapper"
readme="README.md"
requires-python=">=3.10"
dependencies=["click>=8.1.0","rich>=13.0.0"]
[project.scripts]
sockmap="sockmap.cli:main"
[tool.setuptools.packages.find]
where=["src"]
